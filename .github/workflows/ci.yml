name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: agrosense
          POSTGRES_PASSWORD: agrosense_ci_password
          POSTGRES_DB: agrosense
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agrosense -d agrosense"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://agrosense:agrosense_ci_password@localhost:5432/agrosense?schema=public
      NODE_ENV: test
      PORT: 4000
      FRONTEND_URL: http://localhost:5173
      JWT_ACCESS_SECRET: ci_access_secret_replace_with_more_than_32_chars
      JWT_REFRESH_SECRET: ci_refresh_secret_replace_with_more_than_32_chars
      INGEST_API_KEY: ci_ingest_api_key_replace_with_more_than_32_chars
      DEMO_SEED_PASSWORD: ci_demo_password_change_me_2026
      SMTP_HOST: ""
      SMTP_PORT: 587
      SMTP_SECURE: "false"
      SMTP_FROM: AgroSense CI <ci@agrosense.local>

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Prepare local environment file for scripts
        run: touch .env
      - name: Generate Prisma client and migrate database
        working-directory: backend
        run: |
          npm run prisma:generate
          npx prisma migrate deploy
          npm run prisma:seed
      - name: Backend lint, build, and tests
        working-directory: backend
        run: |
          npm run lint
          npm run format:check
          npm run build
          npm test -- --runInBand --coverage
      - name: Frontend lint, tests, and build
        working-directory: frontend
        run: |
          npm run lint
          npm run format:check
          npm test
          npm run build
